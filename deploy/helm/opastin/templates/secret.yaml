{{- if and (not .Values.apiKeys.existingSecret) .Values.apiKeys.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opastin.secretName" . }}
  labels:
    {{- include "opastin.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.apiKeys.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
