# Default values for opastin.

replicaCount: 1

image:
  repository: ghcr.io/OWNER/opastin
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# opastin.toml, mounted at /etc/opastin/opastin.toml. `listen` is forced to 0.0.0.0:8080
# by the container environment. See opastin.example.toml in the repository for options.
config: |
  router_model = "auto"

  [router]
  kind = "random"

  [cache]
  ttl_secs = 300

  [[models]]
  id = "claude-opus-5-5"
  tier = "large"
  anthropic = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }
  openai = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }

  [[models]]
  id = "claude-haiku-5-5"
  tier = "small"
  anthropic = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }
  openai = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }

# Upstream API keys, exposed to the container as environment variables named in the
# config's `api_key_env`. Either reference an existing Secret, or let the chart create
# one from `apiKeys.values` (avoid committing real keys in values files).
apiKeys:
  existingSecret: ""
  values: {}
  #   ANTHROPIC_API_KEY: sk-ant-...

# Local model files for the activation-probe router ([router] kind = "probe"):
# the encoder GGUF and the probe JSON, e.g.
#   encoder_model = "/models/gguf/Qwen3.5-9B-Q8_0.gguf"
#   probe = "/models/probes/llmrouterbench-qwen35-9b.json"
models:
  mountPath: /models
  persistence:
    enabled: false
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 20Gi
  # Files fetched by an init container when missing from the volume.
  download: []
  #  - url: https://huggingface.co/lmstudio-community/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q8_0.gguf
  #    path: gguf/Qwen3.5-9B-Q8_0.gguf
  downloadImage: curlimages/curl:8.10.1

service:
  type: ClusterIP
  port: 80
  # Cache-aware routing and provider-state affinity are tracked in memory per pod;
  # ClientIP affinity keeps a client's conversations on one pod.
  sessionAffinity: ClientIP

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opastin.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
extraEnv: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The random router needs little; the probe router runs a 9B encoder model on CPU
# (about 10 GiB of memory for Q8_0) unless the image is built with a GPU backend.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
