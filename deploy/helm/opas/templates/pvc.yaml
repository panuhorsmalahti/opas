{{- if and .Values.models.persistence.enabled (not .Values.models.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opas.modelsClaim" . }}
  labels:
    {{- include "opas.labels" . | nindent 4 }}
  annotations:
    # Downloaded models are large; keep them when the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.models.persistence.accessModes | nindent 4 }}
  {{- with .Values.models.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.models.persistence.size }}
{{- end }}
