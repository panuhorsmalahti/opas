# Default values for opas.

replicaCount: 1

image:
  repository: ghcr.io/panuhorsmalahti/opas
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# opas.toml, mounted at /etc/opas/opas.toml. `listen` is forced to 0.0.0.0:8080
# by the container environment. See opas.example.toml in the repository for options.
# The default runs the probe router: the predictor ships in the image, and the encoder
# model is downloaded into the models volume on first start (see `models` below).
# Remove [router] for a plain proxy (clients then name a model; no volume needed).
config: |
  router_model = "auto"

  [router]
  kind = "probe"
  encoder_model = "/models/gguf/Qwen3.5-9B-Q8_0.gguf"        # downloaded into the models volume
  probe = "/opt/opas/probes/llmrouterbench-qwen35-9b.json"   # the predictor, shipped in the image
  weights = { quality = 60, speed = 20, cost = 20 }

  [cache]
  ttl_secs = 300

  [[models]]
  id = "claude-opus-5-5"
  tier = "large"
  anthropic = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }
  openai = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }

  [[models]]
  id = "claude-haiku-5-5"
  tier = "small"
  anthropic = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }
  openai = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }

# Upstream API keys, exposed to the container as environment variables named in the
# config's `api_key_env`. Either reference an existing Secret, or let the chart create
# one from `apiKeys.values` (avoid committing real keys in values files).
apiKeys:
  existingSecret: ""
  values: {}
  #   ANTHROPIC_API_KEY: sk-ant-...

# The encoder model for the probe router (9.5 GB), kept on a PVC so it is downloaded
# once. The predictor (probe JSON) is in the image at /opt/opas/probes.
models:
  mountPath: /models
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 20Gi
  # Files fetched by an init container when missing from the volume.
  # Set to [] when the volume is pre-populated or the cluster cannot reach Hugging Face.
  download:
    - url: https://huggingface.co/lmstudio-community/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q8_0.gguf
      path: gguf/Qwen3.5-9B-Q8_0.gguf
  downloadImage: curlimages/curl:8.23.0

service:
  type: ClusterIP
  port: 80
  # Cache-aware routing and provider-state affinity are tracked in memory per pod;
  # ClientIP affinity keeps a client's conversations on one pod.
  sessionAffinity: ClientIP

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opas.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
extraEnv: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The probe router runs a 9B encoder model (about 11 GiB of memory for Q8_0), on CPU
# unless the image is built with a GPU backend (see `gpu`). Prefill is CPU-bound, so give
# it whole cores. A plain proxy (no [router]) needs only ~100m CPU and 64Mi.
resources:
  requests:
    cpu: "4"
    memory: 12Gi
  limits:
    memory: 14Gi

# GPU scheduling for the probe router's encoder (needs an image built with
# Dockerfile.cuda and the NVIDIA device plugin on the cluster), e.g.
#   image.tag: cuda
#   gpu: {enabled: true, resource: nvidia.com/gpu, count: 1}
#   nodeSelector: {nvidia.com/gpu.present: "true"}
gpu:
  enabled: false
  resource: nvidia.com/gpu
  count: 1
runtimeClassName: ""

nodeSelector: {}
tolerations: []
affinity: {}
