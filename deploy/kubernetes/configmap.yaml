apiVersion: v1
kind: ConfigMap
metadata:
  name: opas-config
data:
  opas.toml: |
    # See opas.example.toml for all options.
    listen = "0.0.0.0:8080"
    router_model = "auto"

    # The probe router. The predictor ships in the image; the encoder model is downloaded
    # into the opas-models volume on first start. Remove [router] for a plain proxy.
    [router]
    kind = "probe"
    encoder_model = "/models/gguf/Qwen3.5-9B-Q8_0.gguf"
    probe = "/opt/opas/probes/predictor-model.json"
    weights = { quality = 60, speed = 20, cost = 20 }

    # Cache-aware routing: conversation state is kept in memory per pod, so run one
    # replica or keep clients on one pod (the Service uses ClientIP session affinity).
    [cache]
    ttl_secs = 300

    [[models]]
    id = "claude-opus-5-5"
    tier = "large"
    anthropic = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }
    openai = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }

    [[models]]
    id = "claude-haiku-5-5"
    tier = "small"
    anthropic = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }
    openai = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }
