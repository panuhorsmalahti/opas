apiVersion: apps/v1
kind: Deployment
metadata:
  name: opas
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opas
          image: opas
          args: ["--config", "/etc/opas/opas.toml"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: opas-api-keys
                optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/opas
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: opas-config
