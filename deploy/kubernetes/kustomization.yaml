# Plain Kubernetes manifests for opastin (random router, no local models).
#   kubectl create namespace opastin
#   kubectl -n opastin create secret generic opastin-api-keys --from-literal=ANTHROPIC_API_KEY=...
#   kubectl apply -n opastin -k deploy/kubernetes
# For the activation-probe router (model volume, GPU/CPU sizing) use the Helm chart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: opastin
      app.kubernetes.io/part-of: opastin
    includeSelectors: true
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: opastin
    newName: ghcr.io/OWNER/opastin
    newTag: latest
