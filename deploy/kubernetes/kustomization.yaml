# Plain Kubernetes manifests for opas with the probe router. The predictor ships in the
# image; an init container downloads the encoder model (9.5 GB) into a PVC once.
#   kubectl create namespace opas
#   kubectl -n opas create secret generic opas-api-keys --from-literal=ANTHROPIC_API_KEY=...
#   kubectl apply -n opas -k deploy/kubernetes
# For GPU nodes and other options use the Helm chart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: opas
      app.kubernetes.io/part-of: opas
    includeSelectors: true
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: opas
    newName: ghcr.io/panuhorsmalahti/opas
    newTag: latest
