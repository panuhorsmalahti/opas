name: Release

# On a version tag (v1.2.3): builds the `opas` server and `opas-encode` for Linux
# (x86_64, arm64), macOS (Apple Silicon, Intel) and Windows (x86_64), and publishes a GitHub Release with
# the archives, SHA-256 checksums and the trained predictor. The container image is
# published separately by image.yml. To release: bump `version` in Cargo.toml (and the
# Helm chart), commit, then `git tag v0.2.0 && git push origin v0.2.0`.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build a release for, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # llama.cpp uses only the instruction sets Rust's target-cpu enables; x86-64-v3
          # (AVX2/FMA) matches the Docker image.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-cpu=x86-64-v3
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: ""
          # Metal is on by default on Apple platforms.
          - os: macos-15
            target: aarch64-apple-darwin
            rustflags: ""
          # Intel Macs (Haswell, 2013, or newer for AVX2).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: -C target-cpu=x86-64-v3
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: -C target-cpu=x86-64-v3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check that the tag matches the crate version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Install llama.cpp build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=C:\Program Files\LLVM\bin"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p opas-server -p opas-encoder
      - name: Package
        shell: bash
        run: |
          name="opas-$TAG-${{ matrix.target }}"
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          mkdir -p "dist/$name/probes"
          cp "target/release/opas$exe" "target/release/opas-encode$exe" "dist/$name/"
          cp LICENSE README.md opas.example.toml "dist/$name/"
          cp probes/*.json probes/README.md "dist/$name/probes/"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: opas-${{ matrix.target }}
          path: dist/opas-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Node.js client package
        working-directory: clients/node
        run: |
          npm ci
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npm pack --pack-destination ../../dist
      - name: Checksums
        run: |
          cp probes/predictor-model.json dist/
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: |
          cat > notes.md <<EOF
          ## Downloads

          | Platform | Archive |
          |---|---|
          | Linux x86_64 (AVX2, glibc 2.39+, e.g. Ubuntu 24.04) | \`opas-$TAG-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux arm64 (glibc 2.39+) | \`opas-$TAG-aarch64-unknown-linux-gnu.tar.gz\` |
          | macOS, Apple Silicon (Metal) | \`opas-$TAG-aarch64-apple-darwin.tar.gz\` |
          | macOS, Intel (AVX2) | \`opas-$TAG-x86_64-apple-darwin.tar.gz\` |
          | Windows x86_64 (AVX2) | \`opas-$TAG-x86_64-pc-windows-msvc.zip\` |

          Install with \`curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh\`
          (macOS, Linux) or, in PowerShell,
          \`irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex\` (Windows).

          Each archive holds \`opas\` (the server), \`opas-encode\`, the example config and the
          trained predictor (\`probes/\`). The encoder model (Qwen3.5-9B Q8_0, 9.5 GB) is
          downloaded separately; the install scripts fetch it. On Linux, install
          \`libgomp1\` if it is missing.

          Node.js client: \`npm install https://github.com/${{ github.repository }}/releases/download/$TAG/opas-client-${TAG#v}.tgz\`.

          Container image: \`ghcr.io/${{ github.repository }}:${TAG#v}\`.
          EOF
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "opas $TAG" \
              --notes-file notes.md --generate-notes
          fi
