name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install llama.cpp build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Shellcheck the installer
        run: shellcheck scripts/install.sh scripts/*.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux builds llama.cpp for CPU; macOS (Apple Silicon) builds it with Metal.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install llama.cpp build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - uses: Swatinem/rust-cache@v2
      # Default features (no GPU backends; cuda/vulkan/rocm need their toolkits).
      # Model-backed encoder tests skip without OPAS_TEST_MODEL.
      - run: cargo test --workspace
      - name: Build release binaries
        run: cargo build --release -p opas-server -p opas-encoder

  minimal:
    name: Server without the probe router
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The plain-proxy build: no llama.cpp, no cmake.
      - run: cargo build -p opas-server --no-default-features
      - run: cargo test -p opas -p opas-server --no-default-features --features opas/gateway

  training:
    name: Training tools (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # publishes no major-version tags
      - name: Install (without the Apple-only MLX reference group)
        working-directory: training
        run: uv sync --locked
      - name: Compile check
        working-directory: training
        run: uv run python -m py_compile prepare_llmrouterbench.py train_probe.py reference/*.py

  helm:
    name: Helm chart and Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/opas
      - run: helm template opas deploy/helm/opas > /dev/null
      - name: Render with the probe router and model storage enabled
        run: >
          helm template opas deploy/helm/opas
          --set models.persistence.enabled=true
          --set ingress.enabled=true > /dev/null
      - name: Kustomize build
        run: kubectl kustomize deploy/kubernetes > /dev/null

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: opas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  installer-windows:
    name: Windows installer (parse)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
          "install.ps1 parses"

  node-client:
    name: Node.js client and OpenAPI document
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/node/package-lock.json
      # The plain-proxy build: enough to serve the API and print the OpenAPI document.
      - run: cargo build -p opas-server --no-default-features
      - name: docs/openapi.json is up to date
        run: |
          ./target/debug/opas --openapi | jq 'del(.info.version)' > /tmp/served.json
          jq 'del(.info.version)' docs/openapi.json > /tmp/committed.json
          diff -u /tmp/committed.json /tmp/served.json \
            || { echo "::error::regenerate with: cargo run -p opas-server --no-default-features -- --openapi > docs/openapi.json"; exit 1; }
      - name: Install
        working-directory: clients/node
        run: npm ci
      - name: Generated types are up to date
        working-directory: clients/node
        run: npm run generate && git diff --exit-code src/schema.ts
      - working-directory: clients/node
        run: npm run typecheck && npm run build
      - name: Test (including against the opas binary)
        working-directory: clients/node
        env:
          OPAS_BIN: ${{ github.workspace }}/target/debug/opas
        run: npm test
