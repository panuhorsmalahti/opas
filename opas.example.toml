# opas example config. Copy to opas.toml and adjust.

# Address the server listens on (override with --listen or OPAS_LISTEN).
listen = "127.0.0.1:8080"

# Clients send this as `model` to get a routed request. Sending a configured model id
# instead skips routing and goes straight to that model.
router_model = "auto"

# The activation-probe router (see README "How routing works"). Without a [router]
# section opas is a plain proxy: requests must name a configured model.
[router]
kind = "probe"
encoder_model = "models/gguf/Qwen3.5-9B-Q8_0.gguf"   # the encoder model (scripts/install.sh downloads it)
probe = "probes/predictor-model.json"        # the trained predictor (in the repo and every release)
weights = { quality = 60, speed = 20, cost = 20 }     # default balance; requests override with x-opas-weights
# n_gpu_layers = -1      # encoder layers on the GPU (-1 = all, 0 = CPU only)

# Cache-aware routing: remember which model served each conversation so the next turn
# can account for that provider's prompt cache. On by default.
# Model prices from models.dev (https://models.dev), fetched at startup and refreshed.
[pricing]
models_dev = true
# refresh_hours = 24
# cache_file = "models-dev.json"   # last good copy, for starting offline

[cache]
ttl_secs = 300                 # how long provider prompt caches stay warm
# state_ttl_secs = 604800      # how long stored response ids (Responses / Interactions) pin a model
# enabled = false

# Each model lists where to send each API format: `openai` (Chat Completions),
# `anthropic` (Messages), `responses` (Open Responses) and `interactions` (Gemini).
# A model is a routing candidate only for the formats it has an upstream for.
# `base_url` ends in the API version. `api_key_env` names the env var holding the
# upstream key; leave it out to pass the client's own credentials through.
#
# Prices (USD per million tokens) come, most specific first, from:
# - the request (`x-opas-pricing` header, or `pricing` in `/v1/route`);
# - `pricing = { input = 4.0, cached_input = 0.2, output = 20.0 }` here;
# - models.dev, by `models_dev = "anthropic/claude-opus-5-5"`, or inferred from the
#   upstream URL and model name;
# - the tier's defaults.
#
# `tier` (small / medium / large / xlarge) is what the probe router predicts for.
# `pricing` (USD per million tokens) drives cost estimates, and `speed` response-time
# estimates (`speed = { output_tokens_per_sec = 120, ttft_s = 1.2 }`, counting thinking
# tokens); both default to the tier's typical values. The speeds below were measured
# in November 2026 at default effort; they change with load and effort level.

[[models]]
id = "claude-opus-5-5"
tier = "large"
speed = { output_tokens_per_sec = 110, ttft_s = 1.3 }
anthropic = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }
openai = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }

[[models]]
id = "claude-haiku-5-5"
tier = "small"
speed = { output_tokens_per_sec = 225, ttft_s = 1.0 }
anthropic = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }
openai = { base_url = "https://api.anthropic.com/v1", api_key_env = "ANTHROPIC_API_KEY" }

