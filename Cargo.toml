[workspace]
resolver = "2"
members = ["crates/opas", "crates/opas-server", "crates/opas-encoder"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3.34"
http = "1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0", default-features = false, features = ["macros"] }
uuid = { version = "1.29", features = ["v4"] }
