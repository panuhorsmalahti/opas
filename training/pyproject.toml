[project]
name = "opastin-training"
version = "0.1.0"
description = "Offline tooling for opastin: dataset preparation and probe training (not used at runtime)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "scikit-learn==1.9.1",
]

[dependency-groups]
# Python MLX reference extractor (training/reference/), Apple Silicon only.
reference = ["mlx-lm==0.32.2"]

[tool.uv]
package = false
# Prefer uv-managed Python (a stray x86_64 Python can make uv resolve for the wrong arch).
python-preference = "only-managed"
