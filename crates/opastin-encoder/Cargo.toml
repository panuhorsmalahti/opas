[package]
name = "opastin-encoder"
description = "Run a local LLM's prefill pass in-process (llama.cpp) and capture per-layer hidden states for complexity estimation"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
opastin = { path = "../opastin" }
# Raw llama.cpp bindings: the safe wrapper does not expose the eval callback we need.
# Pinned: the bundled llama.cpp revision determines Qwen3.5 support and tensor names.
llama-cpp-sys-2 = { version = "=0.1.160", default-features = false }
async-trait.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
uuid.workspace = true

[[bin]]
name = "opastin-encode"
path = "src/bin/encode.rs"
