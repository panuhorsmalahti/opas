[package]
name = "opas-server"
description = "HTTP server for opas: OpenAI- and Anthropic-compatible routing endpoints plus a decision-only API"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "opas"
path = "src/main.rs"

[features]
default = ["probe"]
# Activation-probe router: links llama.cpp (needs cmake to build).
probe = ["dep:opas-encoder"]
# Run the probe router's encoder on a GPU backend.
cuda = ["probe", "opas-encoder/cuda"]
vulkan = ["probe", "opas-encoder/vulkan"]
rocm = ["probe", "opas-encoder/rocm"]

[dependencies]
opas = { path = "../opas", features = ["gateway", "openapi"] }
opas-encoder = { path = "../opas-encoder", optional = true }
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { workspace = true, features = ["yaml"] }

[dev-dependencies]
async-trait.workspace = true
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
