[package]
name = "opastin-server"
description = "HTTP server for opastin: OpenAI- and Anthropic-compatible routing endpoints plus a decision-only API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "opastin"
path = "src/main.rs"

[features]
default = ["probe"]
# Activation-probe router: links llama.cpp (needs cmake to build).
probe = ["dep:opastin-encoder"]

[dependencies]
opastin = { path = "../opastin", features = ["gateway"] }
opastin-encoder = { path = "../opastin-encoder", optional = true }
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
