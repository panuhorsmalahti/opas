[project]
name = "opastin-probe"
version = "0.1.0"
description = "Offline tooling for opastin: Python reference extractor, dataset preparation, probe training"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-lm==0.32.2",
    "huggingface-hub>=0.30",
    "numpy>=2",
    "scikit-learn==1.9.1",
]

[tool.uv]
package = false
# A Homebrew x86_64 Python on this machine makes uv resolve for Intel; mlx needs arm64.
python-preference = "only-managed"
